<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="styles/profile.css" />

    <!-- Metadata -->
    <meta name="author" content="Lawrence Corso" />
    <meta name="keywords" content="blog post, civil war, images" />
    <meta
      name="description"
      content="A blog posting page to help simplify the understanding of civilization."
    />
  </head>

  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Site Logo"
          class="header__logo"
        />
      </header>

      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn" type="button">
              <img
                src="<%=require('./images/pencilicon.svg')%>"
                alt="Edit"
                class="profile__avatar-img"
              />
            </button>
            <img src="#" alt="User Avatar" class="profile__avatar" />
          </div>

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">
              She has been to the outermost depths of the sky and ready for
              more.
            </p>

            <button type="button" class="profile__edit-button">
              <img
                src="<%=require('./images/pencil.svg')%>"
                alt="Edit"
                class="profile__edit-icon"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-button">
            <img
              src="<%=require('./images/plus.svg')%>"
              alt="Add"
              class="profile__add-icon"
            />
            New Post
          </button>
        </section>

        <section class="cards page__section">
          <div class="cards__list">
            <template id="card-temp">
              <div class="card">
                <img src="" alt="Card image" class="card__image" />
                <button type="button" class="card__delete-button"></button>
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-button"></button>
                </div>
              </div>
            </template>
          </div>
        </section>
      </main>

      <!-- Edit Profile Modal -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn modal__close-btn-profile"
          >
            <img
              src="<%=require('./images/X.svg')%>"
              alt="Close"
              class="close-icon"
            />
          </button>
          <h2 class="modal__title">Edit Profile</h2>
          <form name="edit-profile" class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Name"
                required
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>

            <label for="profile-name-description" class="modal__label">
              Description
              <input
                id="profile-name-description"
                type="text"
                class="modal__input"
                placeholder="Description"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-name-description-error"
                class="modal__error"
              ></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <!-- Add Card Modal -->
      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn modal__close-btn-card">
            <img
              src="<%=require('./images/X.svg')%>"
              alt="Close"
              class="close-icon"
            />
          </button>
          <h2 class="modal__title">New Post</h2>
          <form name="add-card-form" class="modal__form" novalidate>
            <label for="add-card-link-input" class="modal__label">
              Image Link
              <input
                id="add-card-link-input"
                type="url"
                name="link"
                class="modal__input"
                placeholder="Paste a link to picture"
                required
              />
              <span id="add-card-link-input-error" class="modal__error"></span>
            </label>

            <label for="add-card-name-input" class="modal__label">
              Caption
              <input
                id="add-card-name-input"
                type="text"
                name="name"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span id="add-card-name-input-error" class="modal__error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <!-- Preview Modal -->
      <div class="modal" id="preview-modal">
        <div class="modal__container modal__container_type_preview">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_type_preview"
          ></button>
          <img class="modal__image" src="#" alt="Preview Image" />
          <p class="modal__caption">Hello Sir</p>
        </div>
      </div>

      <!-- Avatar Modal -->
      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn modal__close-btn-avatar"
          >
            <img
              src="<%=require('./images/X.svg')%>"
              alt="Close"
              class="close-icon"
            />
          </button>
          <button class="profile__avatar-btn" type="button">
            <img
              src="<%=require('./images/pencilicon.svg')%>"
              alt="Edit"
              class="profile__avatar-img"
            />
          </button>
          <h2 class="modal__title">Edit Avatar</h2>
          <form name="add-card-form" class="modal__form" novalidate>
            <label for="profile-avatar-input" class="modal__label">
              Avatar
              <input
                id="profile-avatar-input"
                type="url"
                name="avatar"
                class="modal__input"
                placeholder="Paste a link to picture"
                required
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <!-- //style modal -->
      <div class="modal" id="delete-modal">
        <div class="modal__container modal__container-delete">
          <button
            type="button"
            class="modal__close-btn modal__close-btn-delete"
          ></button>
          <h2 class="modal__title modal__title-delete">
            Are you sure you want to delete this card?
          </h2>
          <form class="modal__form" id="delete-form-delete">
            <button
              type="submit"
              class="modal__submit-btn modal__submit-btn-fir"
            >
              Delete
            </button>
            <button
              type="button"
              class="modal__submit-btn modal__submit-btn-sec"
            >
              Cancel
            </button>
          </form>
        </div>
      </div>

      <footer class="footer page__section">
        <h3 class="footer__copy">2025 &copy; Lawrence</h3>
      </footer>
    </div>
  </body>
</html>
